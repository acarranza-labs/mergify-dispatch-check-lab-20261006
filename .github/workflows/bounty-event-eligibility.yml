name: bounty-event-eligibility
on:
  push:
    paths:
      - 'ci/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  required_check:
    name: bounty-required-20261006
    runs-on: ubuntu-latest
    steps:
      - name: Enforce event and actor provenance
        shell: bash
        env:
          BOUNTY_EVENT_NAME: ${{ github.event_name }}
          BOUNTY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ "$BOUNTY_EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi
          [[ "$BOUNTY_EVENT_NAME" == "push" ]]
          [[ "$BOUNTY_ACTOR" == "acarranza-labs" ]]
